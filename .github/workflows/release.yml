name: Publier l'application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
          - os: macos-latest
            target: --mac dmg --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le Mac de GitHub est un Apple Silicon : on ajoute les binaires Intel de
      # sharp pour la version Mac Intel.
      - if: runner.os == 'macOS'
        run: npm install --no-save --force @img/sharp-darwin-x64 @img/sharp-libvips-darwin-x64
      - run: npm test
      - name: Modèle de transcription
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-base-q8-v1
      - run: npm run fetch-model
      - name: Empaquetage
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
