<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Papillon HenergyqueAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Outfit:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f5efe8;
    --surface: #fffaf4;
    --ink: #2b1e18;
    --muted: #7b6a5f;
    --line: #e5d7ca;
    --accent: #b0543a;
    --accent-ink: #ffffff;
    --chosen: #b0543a;
    --bar: rgba(255, 250, 244, 0.92);
    --shadow: 0 18px 40px -24px rgba(90, 50, 30, 0.45);
    --display: "Pixelify Sans", "Courier New", monospace;
    --body: "Outfit", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141010;
      --surface: #1e1816;
      --ink: #f2e8e0;
      --muted: #a9998e;
      --line: #342a25;
      --accent: #e38b6b;
      --accent-ink: #1b120f;
      --chosen: #e38b6b;
      --bar: rgba(30, 24, 22, 0.92);
      --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141010;
    --surface: #1e1816;
    --ink: #f2e8e0;
    --muted: #a9998e;
    --line: #342a25;
    --accent: #e38b6b;
    --accent-ink: #1b120f;
    --chosen: #e38b6b;
    --bar: rgba(30, 24, 22, 0.92);
    --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--body);
    padding-inline: 16px;
    padding-block: 20px 110px;
    overflow-x: hidden;
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; flex-direction: column; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--muted); font-size: 14px; }
  .brand b { color: var(--accent); font-weight: 600; }
  h1 {
    margin: 4px 0 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 8vw, 46px);
    line-height: 1.05;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .lede { margin: 0; color: var(--muted); max-width: 60ch; }

  .track {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin-inline: -16px;
    padding: 4px 16px 18px;
    scrollbar-width: none;
    overscroll-behavior-x: contain;
  }
  .track::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 min(86vw, 380px);
    scroll-snap-align: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
  }
  .card.chosen { border-color: var(--chosen); box-shadow: 0 0 0 2px var(--chosen), var(--shadow); }

  .stage {
    position: relative;
    height: 270px;
    display: grid;
    place-items: center;
    background: radial-gradient(closest-side, rgba(196, 108, 79, 0.3), transparent 72%), #1a1412;
    transition: background-color 0.3s;
  }
  .stage.light { background: radial-gradient(closest-side, rgba(196, 108, 79, 0.2), transparent 72%), #f8f2eb; }
  .stage svg { filter: drop-shadow(0 12px 18px rgba(149, 80, 63, 0.35)); animation: float 6s ease-in-out infinite; }
  .num {
    position: absolute; top: 14px; left: 14px;
    font-family: var(--body); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums;
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    color: #fff; background: linear-gradient(135deg, #edac88, #c46c4f 55%, #95503f);
  }
  .bg-toggle {
    position: absolute; top: 14px; right: 14px;
    font: 500 12.5px var(--body); color: #e9ddd3;
    background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .stage.light .bg-toggle { color: #4a3a31; background: rgba(255, 255, 255, 0.7); border-color: #e2d4c7; }
  .chosen-badge {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font: 600 12.5px var(--body); color: var(--accent-ink); background: var(--chosen);
    border-radius: 999px; padding: 4px 12px; white-space: nowrap;
  }

  .info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .info h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.15; }
  .info p { margin: 0; color: var(--muted); font-size: 15px; }
  .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
  .size {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 12px;
    font-size: 13px; font-weight: 600;
  }
  .size.dark { background: #181818; color: #d8d8d8; border: 1px solid #2e2e2e; }
  .size.light { background: #f8f8f8; color: #3b3b3b; border: 1px solid #dcdcdc; }
  .size.dark b { color: #e5906f; } .size.light b { color: #a64d31; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .term { border-radius: 12px; overflow: hidden; border: 1px solid #2c2c2c; background: #0c0c0c; }
  .term .bar { display: flex; align-items: center; gap: 6px; padding: 7px 10px; background: #1b1b1b; font-size: 11.5px; color: #8a8a8a; }
  .term .bar i { width: 9px; height: 9px; border-radius: 50%; background: #3a3a3a; }
  .term .bar span { margin-left: 6px; }
  .term .screen { display: flex; align-items: center; gap: 12px; padding: 12px; overflow-x: auto; }
  .term pre { margin: 0; font: 14px/1 "Cascadia Mono", Consolas, "Courier New", monospace; }
  .term .facts { font: 12px/1.6 "Cascadia Mono", Consolas, "Courier New", monospace; color: #d6d6d6; white-space: nowrap; }
  .term .facts b { color: #c46c4f; font-weight: 600; } .term .facts em { color: #7d7d7d; font-style: normal; }
  .note { font-size: 13px !important; color: #b8862b !important; }
  .pick {
    margin-top: auto;
    font: 600 16px var(--body); color: var(--ink);
    background: transparent; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 13px 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .pick:hover { border-color: var(--accent); }
  .card.chosen .pick { background: var(--chosen); border-color: var(--chosen); color: var(--accent-ink); }
  .pick:focus-visible, .bg-toggle:focus-visible, .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .dots { display: flex; justify-content: center; gap: 8px; margin-top: -4px; }
  .dots button {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
    font: 600 14px var(--body); font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; padding: 0;
  }
  .dots button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .dots button.fav { box-shadow: 0 0 0 2px var(--chosen); }

  .choice {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .choice-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .choice-art { width: 46px; height: 46px; border-radius: 12px; background: #1a1412; display: grid; place-items: center; flex: none; }
  .choice-art:empty { display: none; }
  .choice-text { display: flex; flex-direction: column; min-width: 0; }
  .choice-text small { color: var(--muted); font-size: 12.5px; }
  .choice-text strong { font-family: var(--body); font-weight: 600; font-size: 17px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .choice-text { flex: 1; }
  .send {
    flex: none;
    font: 600 15px var(--body); color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer;
  }
  .send:disabled { opacity: 0.6; cursor: default; }
  .send.done { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
  .send-form { max-width: 1180px; margin: 12px auto 0; display: grid; gap: 6px; }
  .send-form label { font-size: 13px; font-weight: 600; }
  .send-form label span { font-weight: 400; color: var(--muted); }
  .send-form input, .send-form textarea {
    width: 100%; font: 16px var(--body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; resize: none;
  }
  .send-form input:focus-visible, .send-form textarea:focus-visible, .send:focus-visible, .send-cancel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .send-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .send-cancel { font: 500 15px var(--body); color: var(--muted); background: transparent; border: 0; padding: 11px 12px; cursor: pointer; }
  .send-error { margin: 0; color: #c0392b; font-size: 14px; }
  svg { display: block; shape-rendering: crispEdges; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .stage svg { animation: none; } }

  @media (min-width: 1000px) {
    .track { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; scroll-snap-type: none; }
    .card { flex: 1 1 340px; max-width: calc((100% - 28px) / 3); }
    .dots { display: none; }
  }
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span id="brand-art"></span>Henergyque<b>AI</b></div>
    <h1>Quel papillon préférez-vous ?</h1>
    <p class="lede">Sept poses pour le papillon de l’extension VS Code et du terminal. Faites glisser pour les voir, puis touchez celui que vous préférez.</p>
  </header>
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
</div>
<div class="choice" id="choice">
  <div class="choice-inner">
    <div class="choice-art" id="choice-art"></div>
    <div class="choice-text"><small id="choice-label">Aucun choix pour l’instant</small><strong id="choice-name">Touchez « Je préfère celui-ci »</strong></div>
    <button class="send" id="send-open" type="button" hidden>Envoyer</button>
  </div>
  <form class="send-form" id="send-form" hidden>
    <label for="voter-name">Votre prénom <span>(facultatif)</span></label>
    <input id="voter-name" name="name" type="text" maxlength="40" autocomplete="given-name">
    <label for="voter-comment">Un petit mot <span>(facultatif)</span></label>
    <textarea id="voter-comment" name="comment" rows="2" maxlength="400" placeholder="Pourquoi celui-là ?"></textarea>
    <p class="send-error" id="send-error" role="alert" hidden></p>
    <div class="send-actions">
      <button class="send-cancel" id="send-cancel" type="button">Annuler</button>
      <button class="send" id="send-submit" type="submit">Envoyer mon choix</button>
    </div>
  </form>
</div>
<script src="papillon.js"></script>
</body>
</html>
